<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
      padding: 16px;
    }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #fff; }
    .section {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2a2a4a;
    }
    .section:last-child { border-bottom: none; }
    label {
      display: block;
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .file-drop {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      color: #888;
    }
    .file-drop:hover, .file-drop.dragover {
      border-color: #6c63ff;
      color: #6c63ff;
      background: rgba(108, 99, 255, 0.05);
    }
    .file-drop input { display: none; }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      background: #2a2a4a;
      font-size: 12px;
    }
    .status.ok { border-left: 3px solid #4caf50; }
    .status.warn { border-left: 3px solid #ff9800; }
    .status.err { border-left: 3px solid #f44336; }
    .sync-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-controls button {
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .sync-controls button:hover { background: #3a3a5a; }
    input.sync-value {
      flex: 1;
      text-align: center;
      font-family: monospace;
      font-size: 14px;
      color: #fff;
      background: #1a1a2e;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 4px 2px;
      width: 70px;
      min-width: 0;
    }
    input.sync-value:focus {
      outline: none;
      border-color: #6c63ff;
    }
    .rate-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .rate-row input {
      flex: 1;
      font-family: monospace;
      font-size: 13px;
      color: #fff;
      background: #1a1a2e;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 5px 8px;
      text-align: center;
    }
    .rate-row input:focus { outline: none; border-color: #6c63ff; }
    .rate-presets {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .rate-presets button {
      flex: 1;
      background: #2a2a4a;
      color: #aaa;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 3px 4px;
      cursor: pointer;
      font-size: 10px;
    }
    .rate-presets button:hover { background: #3a3a5a; color: #fff; }
    .calibration {
      background: #222244;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
    }
    .calibration .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .cal-point {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .cal-point .cal-label {
      color: #999;
      width: 16px;
      text-align: center;
      font-weight: 600;
    }
    .cal-point .cal-time {
      font-family: monospace;
      color: #6c63ff;
      font-size: 12px;
      min-width: 50px;
    }
    .cal-point button {
      background: #3a3a5a;
      color: #e0e0e0;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .cal-point button:hover { background: #4a4a6a; }
    .cal-cue {
      font-size: 11px;
      color: #ccc;
      margin-left: 22px;
      margin-bottom: 6px;
      max-height: 32px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-arrows {
      display: flex;
      gap: 4px;
    }
    .cal-arrows button {
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #3a3a5a;
      border-radius: 3px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .cal-arrows button:hover { background: #3a3a5a; }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row button {
      flex: 1;
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-row button:hover { background: #3a3a5a; }
    .btn-danger { color: #f44336 !important; border-color: #5a2a2a !important; }
    .btn-danger:hover { background: #3a1a1a !important; }
    .btn-apply {
      background: #3a3a6a !important;
      color: #8c83ff !important;
      border-color: #5a5a8a !important;
    }
    .btn-apply:hover { background: #4a4a7a !important; }
    select {
      width: 100%;
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
    }
    .filename {
      font-size: 12px;
      color: #6c63ff;
      margin-top: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>Kinopoisk Subtitles</h2>

  <div class="section">
    <div id="status" class="status warn">Checking...</div>
    <div id="filename" class="filename"></div>
  </div>

  <div class="section">
    <label>Load SRT file</label>
    <div class="file-drop" id="fileDrop">
      Drop .srt file here or click to browse
      <input type="file" id="fileInput" accept=".srt,.txt">
    </div>
  </div>

  <div class="section">
    <label>Encoding</label>
    <select id="encoding">
      <option value="utf-8" selected>UTF-8</option>
      <option value="windows-1251">Windows-1251 (Cyrillic)</option>
      <option value="koi8-r">KOI8-R</option>
      <option value="iso-8859-5">ISO-8859-5</option>
      <option value="utf-16le">UTF-16 LE</option>
    </select>
  </div>

  <div class="section">
    <label>Sync offset</label>
    <div class="sync-controls">
      <button id="syncBack1s">-1s</button>
      <button id="syncBack">-0.5s</button>
      <input type="text" class="sync-value" id="syncValue" value="0.0s">
      <button id="syncFwd">+0.5s</button>
      <button id="syncFwd1s">+1s</button>
    </div>

    <label style="margin-top: 10px">Rate</label>
    <div class="rate-row">
      <input type="text" id="rateValue" value="1.000000">
    </div>
    <div class="rate-presets">
      <button data-rate="1.000000">1:1</button>
      <button data-rate="0.959041">25→23.976</button>
      <button data-rate="1.042709">23.976→25</button>
    </div>

    <div class="calibration">
      <div class="hint">
        Two-point calibration: pause at a recognizable line, mark point A.
        Then go to a later line and mark point B. Picks the nearest SRT cue.
      </div>
      <div class="cal-point">
        <span class="cal-label">A</span>
        <span class="cal-time" id="calATime">—</span>
        <button id="calABtn">Mark A here</button>
        <div class="cal-arrows">
          <button class="cal-nudge" data-point="A" data-dir="-1">◀</button>
          <button class="cal-nudge" data-point="A" data-dir="1">▶</button>
        </div>
      </div>
      <div class="cal-cue" id="calACue"></div>
      <div class="cal-point">
        <span class="cal-label">B</span>
        <span class="cal-time" id="calBTime">—</span>
        <button id="calBBtn">Mark B here</button>
        <div class="cal-arrows">
          <button class="cal-nudge" data-point="B" data-dir="-1">◀</button>
          <button class="cal-nudge" data-point="B" data-dir="1">▶</button>
        </div>
      </div>
      <div class="cal-cue" id="calBCue"></div>
      <div class="btn-row" style="margin-top: 8px">
        <button id="calApply" class="btn-apply">Apply calibration</button>
      </div>
    </div>
  </div>

  <div class="section">
    <label>Font size</label>
    <select id="fontSize">
      <option value="1.6vw">Small</option>
      <option value="2.2vw" selected>Medium</option>
      <option value="3vw">Large</option>
      <option value="3.8vw">Extra Large</option>
    </select>
  </div>

  <div class="section">
    <div class="btn-row">
      <button id="toggleBg">Toggle Background</button>
      <button id="clearSubs" class="btn-danger">Clear</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
